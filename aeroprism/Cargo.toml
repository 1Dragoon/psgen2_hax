[package]
name = "aeroprism"
version = "0.1.1"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.5.60", features = ["derive"] }
colog = "1.4.0"
env_logger = "0.11.9"
hadris-iso = "1.0.1"
hex_lit = "0.1.1"
indexmap = { version = "2.13.0", features = ["serde"] }
log = "0.4.29"
meowhash = "0.3.0"
picori = "0.1.0"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
shellexpand = { version = "3.1.1", features = ["os_str_bytes", "path"] }
snafu = "0.8.9"
soft-canonicalize = { version = "0.5.4", features = ["dunce"] }
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread", "fs", "io-util", "time"] }
toml = { version = "0.9.8", features = ["preserve_order"] }
unicode-segmentation = "1.12.0"
