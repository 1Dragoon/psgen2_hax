[package]
name = "aeroprism"
version = "0.3.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.6.0", features = ["derive"] }
colog = "1.4.0"
env_logger = "0.11.10"
hadris-iso = "1.1.0"
hex_lit = "0.1.1"
indexmap = { version = "2.14.0", features = ["serde"] }
itertools = "0.14.0"
log = "0.4.29"
meowhash = "0.3.0"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
shellexpand = { version = "3.1.1", features = ["os_str_bytes", "path"] }
snafu = "0.9.0"
soft-canonicalize = { version = "0.5.5", features = ["dunce"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.51.1", features = ["macros", "rt", "rt-multi-thread", "fs", "io-util", "time"] }
toml = { version = "1.1.2", features = ["preserve_order"] }
unicode-segmentation = "1.13.2"
